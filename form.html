<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adicione uma nova receita ao seu acervo culinário.">
    <title>Nova Receita</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/nav-new.css">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

    <a href="#main-content" class="skip-link">Pular para o conteúdo</a>

    <nav class="navbar" aria-label="Navegação principal">
        <div class="navbar-inner">
            <ul class="navbar-nav" role="menubar">
                <li role="none">
                    <a href="index.html" class="nav-link" role="menuitem">Início</a>
                </li>
                <li role="none">
                    <a href="concerto.html" class="nav-link" role="menuitem">Concerto</a>
                </li>
                <li role="none">
                    <a href="receita.html" class="nav-link" role="menuitem">Receita</a>
                </li>
                <li role="none">
                    <a href="form.html" class="nav-link active" role="menuitem" aria-current="page">Nova Receita</a>
                </li>
                <li role="none">
                    <a href="viola.html" class="nav-link" role="menuitem">Viola 3D</a>
                </li>
            </ul>
            <button class="nav-hamburger" aria-label="Abrir menu" aria-expanded="false">
                <span class="nav-hamburger-line"></span>
                <span class="nav-hamburger-line"></span>
                <span class="nav-hamburger-line"></span>
            </button>
        </div>
    </nav>

    <div class="nav-overlay" aria-hidden="true"></div>

    <header>
        <h1>Adicionar nova receita</h1>
        <p>Preencha os campos abaixo para cadastrar uma nova receita</p>
    </header>

    <main id="main-content" class="form-main">
        <div class="form-container">

            <form novalidate>

                <div class="form-group">
                    <label for="nome" class="form-label">Nome da receita</label>
                    <input type="text" id="nome" name="nome" class="input" placeholder="Digite o nome da receita" required>
                </div>

                <div class="form-group">
                    <label for="categoria" class="form-label">Categoria</label>
                    <select id="categoria" name="categoria" class="select" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="sobremesa">Sobremesa</option>
                        <option value="almoco">Almoço</option>
                        <option value="jantar">Jantar</option>
                        <option value="lanche">Lanche</option>
                        <option value="bebida">Bebida</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="tempo" class="form-label">Tempo de preparo</label>
                        <input type="time" id="tempo" name="tempo" class="input">
                    </div>

                    <div class="form-group form-group-half">
                        <label for="porcoes" class="form-label">Quantidade de porções</label>
                        <input type="number" id="porcoes" name="porcoes" class="input" min="1" placeholder="Ex: 10">
                    </div>
                </div>

                <div class="form-group">
                    <label for="ingredientes" class="form-label">Ingredientes</label>
                    <textarea id="ingredientes" name="ingredientes" class="textarea" rows="6" placeholder="Digite os ingredientes da receita" required></textarea>
                </div>

                <div class="form-group">
                    <label for="preparo" class="form-label">Modo de preparo</label>
                    <textarea id="preparo" name="preparo" class="textarea" rows="8" placeholder="Digite o modo de preparo" required></textarea>
                </div>

                <fieldset class="form-fieldset">
                    <legend class="form-label">Dificuldade</legend>
                    <div class="form-radio-group">
                        <label class="form-label-inline">
                            <input type="radio" id="facil" name="dificuldade" value="facil" class="input-radio">
                            Fácil
                        </label>
                        <label class="form-label-inline">
                            <input type="radio" id="medio" name="dificuldade" value="medio" class="input-radio">
                            Médio
                        </label>
                        <label class="form-label-inline">
                            <input type="radio" id="dificil" name="dificuldade" value="dificil" class="input-radio">
                            Difícil
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label class="form-label-inline">
                        <input type="checkbox" id="publicar" name="publicar" class="input-checkbox">
                        Publicar receita imediatamente
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Adicionar receita</button>
                    <button type="reset" class="btn btn-secondary">Limpar formulário</button>
                </div>

            </form>

        </div>
    </main>

    <footer class="site-footer">
        <p>realizzato da Miguel Lima</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
